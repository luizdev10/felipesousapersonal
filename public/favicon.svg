<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="disk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="0.5" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="halo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0" stop-color="#14122B"/>
      <stop offset="1" stop-color="#07060F"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <g transform="translate(256 256)">
    <!-- brilho da lente gravitacional -->
    <circle r="92" fill="none" stroke="url(#halo)" stroke-width="10" opacity="0.55" filter="url(#glow)"/>
    <circle r="92" fill="none" stroke="url(#halo)" stroke-width="4"/>
    <!-- parte de trás do disco -->
    <g transform="rotate(-18)">
      <path d="M -170 0 A 170 42 0 0 1 170 0" fill="none" stroke="url(#disk)" stroke-width="14" stroke-linecap="round" opacity="0.8"/>
    </g>
    <!-- horizonte de eventos -->
    <circle r="84" fill="#000"/>
    <!-- parte da frente do disco -->
    <g transform="rotate(-18)">
      <path d="M -170 0 A 170 42 0 0 0 170 0" fill="none" stroke="url(#disk)" stroke-width="14" stroke-linecap="round"/>
    </g>
  </g>
</svg>
